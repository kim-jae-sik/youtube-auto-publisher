name: 24/7 Autonomous YouTube Long-form Publisher

on:
  schedule:
    # 💡 1시간마다 클라우드 서버가 자동 실행 (매 정시 00분)
    - cron: '0 * * * *'

  # GitHub 웹 화면에서 언제든 [Run workflow] 버튼으로 즉시 1편 제작 및 업로드 가능
  workflow_dispatch:

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. 코스 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.12 최신 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. 시스템 FFmpeg 및 한국어 나눔 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra

      - name: 4. 필수 파이썬 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. 10분+ 롱폼 영상 기획·렌더링 & 유튜브 전체공개 업로드 실행
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python cloud_runner.py

      - name: 6. 렌더링된 10분 영상 및 썸네일 아티팩트 보관 (선택 다운로드용)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-production-files
          path: |
            output/cloud_video_10min.mp4
            output/cloud_thumbnail.png
            logs/cloud_publish_log.json
          retention-days: 7
